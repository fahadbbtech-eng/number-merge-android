# Number Merge - build and (optionally) upload to Google Play INTERNAL TESTING.
# Never uploads to Production. Secrets needed (Settings > Secrets > Actions):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD  -> signed .aab
#   PLAY_SERVICE_ACCOUNT_JSON                         -> automatic upload to Internal testing
name: Build and upload

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test APK (debug)
        run: gradle :app:assembleDebug --no-daemon

      - name: Play Store file (.aab), signed
        if: env.HAS_KEY == 'true'
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEY_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle :app:bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab numbermerge-${{ github.run_number }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the files on this run
        uses: actions/upload-artifact@v4
        with:
          name: numbermerge-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            numbermerge-*.aab
          if-no-files-found: warn

      - name: Upload to Google Play - Internal testing only
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.bbtech.numbermerge
          releaseFiles: numbermerge-${{ github.run_number }}.aab
          track: internal
          status: completed

      - name: Summary
        if: always()
        run: |
          echo "### Number Merge build ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Package: in.bbtech.numbermerge" >> $GITHUB_STEP_SUMMARY
          echo "- Signed .aab: ${{ env.HAS_KEY == 'true' && 'yes' || 'no (signing secrets missing)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Uploaded to Internal testing: ${{ env.HAS_KEY == 'true' && env.HAS_PLAY == 'true' && 'yes' || 'no (Play secret missing)' }}" >> $GITHUB_STEP_SUMMARY
